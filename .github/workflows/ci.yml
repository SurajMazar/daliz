name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: daliz_root
          POSTGRES_PASSWORD: ci_root_password
          POSTGRES_DB: postgres
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U daliz_root" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: daliz_minio
          MINIO_ROOT_PASSWORD: ci_minio_password
        ports: ['59000:9000']
    env:
      APP_BASE_URL: http://localhost:5173
      PLATFORM_DB_HOST: 127.0.0.1
      PLATFORM_DB_PORT: 55432
      PLATFORM_DB_NAME: daliz_platform
      PLATFORM_DB_USER: daliz_platform
      PLATFORM_DB_PASSWORD: ci_platform_password
      PROVISIONER_DB_USER: daliz_provisioner
      PROVISIONER_DB_PASSWORD: ci_provisioner_password
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: 55432
      REDIS_URL: redis://127.0.0.1:56379/0
      ENCRYPTION_KEYS: ci:Y2ktZW5jcnlwdGlvbi1rZXktZXhhY3RseS0zMmJ5dGU=
      TOKEN_HMAC_KEY: Y2ktaG1hYy1rZXktZm9yLWRhbGl6LWNpLXBpcGVsaW5lcw==
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: daliz-ci
      S3_ACCESS_KEY_ID: daliz_minio
      S3_SECRET_ACCESS_KEY: ci_minio_password
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 1025
      MAIL_FROM: Daliz CI <ci@daliz.test>
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Create database roles
        env:
          PGPASSWORD: ci_root_password
          POSTGRES_USER: daliz_root
          DALIZ_PLATFORM_DB: daliz_platform
          DALIZ_PLATFORM_DB_USER: daliz_platform
          DALIZ_PLATFORM_DB_PASSWORD: ci_platform_password
          DALIZ_PROVISIONER_USER: daliz_provisioner
          DALIZ_PROVISIONER_PASSWORD: ci_provisioner_password
        run: |
          sudo apt-get install -y postgresql-client >/dev/null
          sed 's/--username "$POSTGRES_USER"/-h 127.0.0.1 -p 55432 --username "$POSTGRES_USER"/' infra/postgres/init/01-roles.sh > /tmp/roles.sh
          sh /tmp/roles.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @daliz/shared build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit + integration + security tests
        run: pnpm -r test
      - name: Build
        run: pnpm build

  images:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API/worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: daliz-api:${{ github.sha }}
